image: node:24-bookworm-slim

stages:
  - verify

verify:
  stage: verify
  before_script:
    - npm install --global pnpm@12.8.1 --ignore-scripts
    - pnpm install --frozen-lockfile
  script:
    - pnpm lint
    - pnpm test
    - pnpm audit --audit-level=low
    - npm pack --dry-run --ignore-scripts
